<script>
function updateProgress(percent, text) {

function addLog(msg, isError) {

 const time = new Date().toLocaleTimeString();
 const div = document.createElement("div");
 if (isError) { div.className = "log-err"; }
 div.textContent = "[" + time + "] " + msg;
 logBox.appendChild(div);
 logBox.scrollTop = logBox.scrollHeight;
}
document.addEventListener("DOMContentLoaded", function() {
 document.getElementById("debugLog").innerHTML = "";

// 100% 沿用 GPT 連線底座函數
function getBasePrice(stockId) {
 if (stockId === "2330") return 920;
 if (stockId === "2317") return 185;
 if (stockId === "3406") return 365;
 if (stockId === "2409") return 18;
 let hash = 0;
 for (let i = 0; i < stockId.length; i++) { hash += stockId.charCodeAt(i); }
 return hash % 150 + 20;
}

// 100% 沿用 GPT 連線底座函數
function buildStockData(basePrice) {
 const data = []; const today = new Date();
 for (let i = 100; i >= 0; i--) {
 const d = new Date(today.getTime() - i * 24 * 60 * 60 * 1000);
 const dateStr = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
 let wave = Math.sin(i * 0.22) * basePrice * 0.1;
 let trend = (100 - i) * basePrice * 0.0015;
 let close = basePrice + wave + trend;
 let open = close + (Math.random() - 0.5) * basePrice * 0.03;
 let high = Math.max(open, close) + Math.random() * basePrice * 0.02;
 let low = Math.min(open, close) - Math.random() * basePrice * 0.02;
 data.push({ time: dateStr, open: round2(open), high: round2(high), low: round2(low), close: round2(close) });
 }
 return data;
}

// 100% 沿用 GPT 連線底座函數
function calcMA(data) {
 for (let i = 0; i < data.length; i++) {
 let sum20 = 0; let count20 = 0;
 for (let j = Math.max(0, i - 19); j <= i; j++) { sum20 += data[j].close; count20++; }
 data[i].ma20 = sum20 / count20;
 let sum60 = 0; let count60 = 0;
 for (let k = Math.max(0, i - 59); k <= i; k++) { sum60 += data[k].close; count60++; }
 data[i].ma60 = sum60 / count60;
 }
 addLog("✓ 均線計算完成");
}
