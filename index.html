function updateProgress(percent, text) {
 document.getElementById("myBar").style.width = percent + "%";
 document.getElementById("myText").innerText = percent + "%";

function addLog(msg, isError) {
 const logBox = document.getElementById("debugLog");
 const time = new Date().toLocaleTimeString();
 const div = document.createElement("div");

 if (isError) {
  div.className = "log-err";
 }

 div.textContent = "[" + time + "] " + msg;
 logBox.appendChild(div);
 logBox.scrollTop = logBox.scrollHeight;
}

function escapeHtml(text) {
 return String(text)
  .replaceAll("&", "&amp;")
  .replaceAll("<", "&lt;")
  .replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;")
  .replaceAll("'", "&#039;");
}

async function fetchRealStockData(stockId) {
 addLog("▶ 呼叫 Worker 後端抓取真實 K 線：" + stockId);

 const response = await fetch(WORKER_BASE_URL + "/api/stock?stockId=" + encodeURIComponent(stockId));
 const json = await response.json();

 if (!response.ok || !json.ok) {
  throw new Error(json.error || "後端抓取失敗");
 }

 addLog("✓ 真實 K 線資料成功，來源：" + json.source + "，共 " + json.data.length + " 筆");

 return json.data;
}

async function callGoogleAI(prompt) {
 try {
  const response = await fetch(WORKER_BASE_URL + "/api/google-ai", {
   method: "POST",
   headers: {
    "Content-Type": "application/json"
   },
   body: JSON.stringify({
    prompt: prompt
   })
  });

  const json = await response.json();

  if (!response.ok || !json.ok) {
   throw new Error(json.error || "Google AI 連線失敗");
  }

  addLog("✓ Google AI 已成功回傳");
  return json.text;

 } catch (err) {
  addLog("⚠ Google AI 連線失敗：" + err.message, true);
  return "Google AI 補充失敗：" + err.message;
 }
}

function calcMA(data) {
 for (let i = 0; i < data.length; i++) {
  data[i].ma5 = averageClose(data, i, 5);
  data[i].ma10 = averageClose(data, i, 10);
  data[i].ma20 = averageClose(data, i, 20);
  data[i].ma60 = averageClose(data, i, 60);
  data[i].vol5 = averageVolume(data, i, 5);
 }
 addLog("✓ 均線計算完成");
}

function averageClose(data, i, n) {
 let sum = 0;
 let count = 0;
 for (let j = Math.max(0, i - n + 1); j <= i; j++) {
  sum += data[j].close;
  count++;
 }
 return sum / count;
}

function averageVolume(data, i, n) {
 let sum = 0;
 let count = 0;
 for (let j = Math.max(0, i - n + 1); j <= i; j++) {
  sum += Number(data[j].volume || 0);
  count++;
 }
 return count > 0 ? sum / count : 0;
}

 return {

  type: type,

}

function runAnalysis(data, stockId) {
 const reportList = document.getElementById("reportList");
 reportList.innerHTML = "";

 const signals = analyzeFangTianLongV1(data);
 let bullScore = 0;
 let bearScore = 0;

 for (let i = 0; i < signals.length; i++) {
  if (signals[i].score > 0) {
   bullScore += signals[i].score;
  }
  if (signals[i].score < 0) {
   bearScore += Math.abs(signals[i].score);
  }
 }

 renderSummary(bullScore, bearScore, signals.length);

 if (signals.length === 0) {
  reportList.innerHTML =
   '<div class="item"><div class="name">目前無明顯訊號</div><div class="desc">尚未偵測到明確多空型態。</div></div>';
  return { bullScore: bullScore, bearScore: bearScore };
 }

 for (let i = 0; i < signals.length; i++) {
  const s = signals[i];
  const div = document.createElement("div");
  div.className = "item " + s.type;

  div.innerHTML =
   '<div class="date">' + s.date + '</div>' +
   '<div class="name">' + s.name + '</div>' +
   '<div class="desc">' + s.desc + '</div>';

  reportList.appendChild(div);
 }

 addLog("✓ 方天龍 01～95 規則庫命中 " + signals.length + " 筆訊號");

 return { bullScore: bullScore, bearScore: bearScore };
}

function renderSummary(bullScore, bearScore, count) {
 let bias = "盤整觀察";
 let color = "#ff9100";

 if (bullScore > bearScore * 1.25) {
  bias = "多方優勢";
  color = "#ef5350";
 } else if (bearScore > bullScore * 1.25) {
  bias = "空方優勢";
  color = "#26a69a";
 }

 document.getElementById("summaryBox").innerHTML =
  '<div class="summary-card" style="border-left-color:' + color + '">' +
  '<div class="label">綜合方向</div>' +
  '<div class="value">' + bias + '</div>' +
  '</div>' +
  '<div class="summary-card">' +
  '<div class="label">多方分數</div>' +
  '<div class="value">' + bullScore + '</div>' +
  '</div>' +
  '<div class="summary-card">' +
  '<div class="label">空方分數 / 命中</div>' +
  '<div class="value">' + bearScore + " / " + count + '</div>' +
  '</div>';
}

function analyzeFangTianLongV1(data) {
 const signals = [];

 if (!data || data.length < 60) {
  return signals;
 }

 for (let i = 2; i < data.length; i++) {
  const curr = data[i];
  const prev = data[i - 1];
  const prev2 = data[i - 2];

  const trend = getTrendContext(data, i);
  const candle = getCandleInfo(curr);

  if (curr.low > prev.high) {
   pushSignal(signals, 4, curr, "今日低點高於昨日高點，形成向上跳空缺口。若後續不回補，偏多力道較強。");
  }

  if (curr.high < prev.low) {
   pushSignal(signals, 7, curr, "今日高點低於昨日低點，形成向下跳空缺口。若反彈無法回補，偏空。");
  }

  if (prev.close <= prev.ma20 && curr.close > curr.ma20) {
   pushSignal(signals, 29, curr, "收盤重新站上 MA20，短線生命線轉強。");
  }

  if (prev.close >= prev.ma20 && curr.close < curr.ma20) {
   pushSignal(signals, 58, curr, "收盤跌破 MA20，短線轉弱，需觀察是否能快速站回。");
  }

  if (curr.close > curr.ma20 && curr.ma20 > curr.ma60) {
   pushSignal(signals, 32, curr, "股價 > MA20 > MA60，趨勢結構偏多。");
  }

  if (curr.close < curr.ma20 && curr.ma20 < curr.ma60) {
   pushSignal(signals, 72, curr, "股價 < MA20 < MA60，趨勢結構偏空。");
  }

  if (candle.isBull && candle.bodyRatio > 0.65 && candle.changePct > 2) {
   pushSignal(signals, 11, curr, "出現長紅 K，買盤力道明顯。若搭配放量，攻擊力更強。");
  }

  if (candle.isBear && candle.bodyRatio > 0.65 && candle.changePct < -2) {
   pushSignal(signals, 11, curr, "出現長黑 K，賣壓明顯。若在高檔區，需防轉弱。");
  }

  if (trend === "low" && candle.lowerShadowRatio > 0.55 && candle.bodyRatio < 0.35) {
   pushSignal(signals, 25, curr, "低檔出現長下影小實體，代表下方承接力浮現。");
  }

  if (trend === "high" && candle.upperShadowRatio > 0.55 && candle.bodyRatio < 0.35) {
   pushSignal(signals, 86, curr, "高檔出現長上影，代表上攻遇壓。");
  }

  if (candle.bodyRatio < 0.12) {
   if (trend === "high") {
    pushSignal(signals, 20, curr, "高檔十字線代表多空猶豫，若隔日轉弱需小心。");
   } else if (trend === "low") {
    pushSignal(signals, 19, curr, "低檔十字線代表殺盤鈍化，需隔日紅 K 確認。");
   } else {
    pushSignal(signals, 17, curr, "十字線代表多空拉鋸，需等待下一根確認方向。");
   }
  }

  if (
   prev.close < prev.open &&
   curr.close > curr.open &&
   curr.close > prev.open &&
   curr.open < prev.close
  ) {
   pushSignal(signals, 50, curr, "紅 K 包覆前一根黑 K，若在低檔出現，偏多反轉機率提高。");
  }

  if (
   prev.close > prev.open &&
   curr.close < curr.open &&
   curr.open > prev.close &&
   curr.close < prev.open
  ) {
   pushSignal(signals, 78, curr, "黑 K 包覆前一根紅 K，代表賣壓轉強。");
  }

  if (
   curr.close > curr.open &&
   prev.close > prev.open &&
   prev2.close > prev2.open &&
   curr.close > prev.close &&
   prev.close > prev2.close
  ) {
   pushSignal(signals, 45, curr, "連續三根紅 K 向上推進，多方攻擊力增強。");
  }

  if (
   curr.close < curr.open &&
   prev.close < prev.open &&
   prev2.close < prev2.open &&
   curr.close < prev.close &&
   prev.close < prev2.close
  ) {
   pushSignal(signals, 84, curr, "連續三根黑 K 下壓，空方主導力增強。");
  }

  if (
   prev2.close < prev2.open &&
   prev.close > prev.open &&
   curr.close < curr.open &&
   curr.close < prev.close
  ) {
   pushSignal(signals, 95, curr, "黑紅黑結構出現，若在跌勢或反彈末端，代表反彈失敗風險。");
  }

  if (
   curr.close > prev.close &&
   prev.close > prev2.close &&
   curr.low >= prev.low &&
   prev.low >= prev2.low
  ) {
   pushSignal(signals, 67, curr, "收盤與低點逐步墊高，形成起漲階梯結構。");
  }

  if (isTripleTop(data, i)) {
   pushSignal(signals, 75, curr, "近期多次挑戰高點未過，需防形成高檔壓力。");
  }

  const box = getBoxBreak(data, i);
  if (box === "up") {
   pushSignal(signals, 40, curr, "突破近期箱型上緣，偏多觀察。");
  } else if (box === "down") {
   pushSignal(signals, 40, curr, "跌破近期箱型下緣，偏空觀察。");
  }
 }

 return mergeAndSortSignals(signals);
}

function pushSignal(signals, ruleId, candle, extraText) {
 const rule = FTL_RULES.find(function(x) {
  return x.id === ruleId;
 });

 if (!rule) return;

 signals.push({
  id: rule.id,
  type: rule.bias === "bull" ? "buy" : rule.bias === "bear" ? "sell" : "master",
  date: candle.time,
  name: "單元 " + String(rule.id).padStart(2, "0") + "｜" + rule.name,
  desc: extraText + "｜分數：" + rule.score + "｜" + rule.msg,
  score: rule.score
 });
}

function getCandleInfo(d) {
 const range = Math.max(d.high - d.low, 0.0001);
 const body = Math.abs(d.close - d.open);
 const upperShadow = d.high - Math.max(d.open, d.close);
 const lowerShadow = Math.min(d.open, d.close) - d.low;

 return {
  isBull: d.close > d.open,
  isBear: d.close < d.open,
  bodyRatio: body / range,
  upperShadowRatio: upperShadow / range,
  lowerShadowRatio: lowerShadow / range,
  changePct: ((d.close - d.open) / d.open) * 100
 };
}

function getTrendContext(data, i) {
 const start = Math.max(0, i - 60);
 const section = data.slice(start, i + 1);

 const highs = section.map(function(d) { return d.high; });
 const lows = section.map(function(d) { return d.low; });

 const maxHigh = Math.max.apply(null, highs);
 const minLow = Math.min.apply(null, lows);

 const curr = data[i];
 const pos = (curr.close - minLow) / Math.max(maxHigh - minLow, 0.0001);

 if (pos > 0.75) return "high";
 if (pos < 0.25) return "low";
 return "middle";
}

function isTripleTop(data, i) {
 if (i < 40) return false;

 const recent = data.slice(i - 40, i + 1);
 const currHigh = data[i].high;

 let touchCount = 0;

 for (let j = 0; j < recent.length; j++) {
  const diff = Math.abs(recent[j].high - currHigh) / currHigh;

  if (diff < 0.025) {
   touchCount++;
  }
 }

 return touchCount >= 3;
}

function getBoxBreak(data, i) {
 if (i < 30) return "";

 const prevRange = data.slice(i - 30, i);
 const highs = prevRange.map(function(d) { return d.high; });
 const lows = prevRange.map(function(d) { return d.low; });

 const boxHigh = Math.max.apply(null, highs);
 const boxLow = Math.min.apply(null, lows);
 const curr = data[i];

 if (curr.close > boxHigh) return "up";
 if (curr.close < boxLow) return "down";

 return "";
}

function mergeAndSortSignals(signals) {
 const map = {};
 const result = [];

 for (let i = signals.length - 1; i >= 0; i--) {
  const s = signals[i];
  const key = s.id + "_" + s.date;

  if (!map[key]) {
   map[key] = true;
   result.push(s);
  }
 }

 result.sort(function(a, b) {
  return Math.abs(b.score) - Math.abs(a.score);
 });

 return result.slice(0, 35);
}

function drawChart(data) {
 const canvas = document.getElementById("stockCanvas");
 const ctx = canvas.getContext("2d");

 const w = canvas.width;
 const h = canvas.height;
 const padding = 50;

 ctx.clearRect(0, 0, w, h);

 const visible = data.slice(-90);
 const prices = [];

 for (let i = 0; i < visible.length; i++) {
  prices.push(visible[i].high);
  prices.push(visible[i].low);
  prices.push(visible[i].ma20);
  prices.push(visible[i].ma60);
 }

 const maxPrice = Math.max.apply(null, prices);
 const minPrice = Math.min.apply(null, prices);
 const range = maxPrice - minPrice || 1;

 function getX(i) {
  return padding + i * ((w - padding * 2) / visible.length);
 }

 function getY(price) {
  return h - padding - ((price - minPrice) / range) * (h - padding * 2);
 }

 ctx.strokeStyle = "#2a2e39";
 ctx.lineWidth = 1;

 for (let i = 0; i <= 5; i++) {
  const y = padding + i * ((h - padding * 2) / 5);

  ctx.beginPath();
  ctx.moveTo(padding, y);
  ctx.lineTo(w - padding, y);
  ctx.stroke();

  const price = maxPrice - i * range / 5;
  ctx.fillStyle = "#787b86";
  ctx.font = "12px Arial";
  ctx.fillText(price.toFixed(2), 8, y + 4);
 }

 const candleW = Math.max(4, ((w - padding * 2) / visible.length) * 0.55);

 for (let i = 0; i < visible.length; i++) {
  const d = visible[i];
  const x = getX(i);

  const openY = getY(d.open);
  const closeY = getY(d.close);
  const highY = getY(d.high);
  const lowY = getY(d.low);

  const up = d.close >= d.open;
  ctx.strokeStyle = up ? "#ef5350" : "#26a69a";
  ctx.fillStyle = up ? "#ef5350" : "#26a69a";

  ctx.beginPath();
  ctx.moveTo(x, highY);
  ctx.lineTo(x, lowY);
  ctx.stroke();

  const top = Math.min(openY, closeY);
  const height = Math.max(Math.abs(closeY - openY), 1);

  ctx.fillRect(x - candleW / 2, top, candleW, height);
 }

 drawLine(ctx, visible, "ma20", getX, getY, "#2962ff");
 drawLine(ctx, visible, "ma60", getX, getY, "#ff9800");
}

function drawLine(ctx, data, key, getX, getY, color) {
 ctx.beginPath();
 ctx.strokeStyle = color;
 ctx.lineWidth = 2;

 for (let i = 0; i < data.length; i++) {
  const x = getX(i);
  const y = getY(data[i][key]);

  if (i === 0) {
   ctx.moveTo(x, y);
  } else {
   ctx.lineTo(x, y);
  }
 }

 ctx.stroke();
}
