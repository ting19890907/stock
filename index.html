 div.className = "log-err";
 }
 div.textContent = "[" + time + "] " + msg;
 logBox.appendChild(div);
 logBox.scrollTop = logBox.scrollHeight;
}

function getBasePrice(stockId) {
 if (stockId === "2330") return 920;
 if (stockId === "2317") return 185;
 if (stockId === "3406") return 365;
 if (stockId === "2409") return 18;
 let hash = 0;
 for (let i = 0; i < stockId.length; i++) {
 hash += stockId.charCodeAt(i);
 }
 return hash % 150 + 20;
}

function buildStockData(basePrice, stockId) {

 let wave = Math.sin(i * 0.22) * basePrice * 0.1;
 let trend = (100 - i) * basePrice * 0.0015;
 let close = basePrice + wave + trend;
 let open = close + (Math.random() - 0.5) * basePrice * 0.03;
 let high = Math.max(open, close) + Math.random() * basePrice * 0.02;
 let low = Math.min(open, close) - Math.random() * basePrice * 0.02;

 // 🚀 100% 對焦單元 95 友達 (2409) 兩陰夾一陽空頭三明治

 if (i === 12) { open = basePrice * 1.15; close = basePrice * 1.05; high = open; low = close; } // 長黑一

 if (i === 10) { open = basePrice * 1.12; close = basePrice * 1.04; high = open; low = close; } // 長黑二包夾
 }

 data.push({
 time: dateStr,
 open: round2(open),
 high: round2(high),
 low: round2(low),
 close: round2(close)
 });
 }
 return data;
}

function calcMA(data) {
 for (let i = 0; i < data.length; i++) {
 let sum20 = 0; let count20 = 0;
 for (let j = Math.max(0, i - 19); j <= i; j++) { sum20 += data[j].close; count20++; }
 data[i].ma20 = sum20 / count20;
 let sum60 = 0; let count60 = 0;
 for (let k = Math.max(0, i - 59); k <= i; k++) { sum60 += data[k].close; count60++; }
 data[i].ma60 = sum60 / count60;
 }
 addLog("✓ 均線計算完成");
}
