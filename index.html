<div class="container">

 <div class="header">

 </div>

 <div class="card" style="margin-top:20px;">

 </div>

<script>
/*
  這裡貼你的 Google AI API Key
  注意：單一 HTML 版本會讓 API Key 暴露在前端，只建議自己電腦測試用。
*/
const GOOGLE_API_KEY = "請貼上你的Google_AI_API_KEY";

/*
  這裡可換模型：
  gemini-1.5-flash
  gemini-1.5-pro
  gemini-2.0-flash
  gemini-2.5-flash
*/
const GOOGLE_MODEL = "gemini-1.5-flash";

function updateProgress(percent, text) {
 document.getElementById("myBar").style.width = percent + "%";
 document.getElementById("myText").innerText = percent + "%";
 document.getElementById("stepStatus").innerText = text;
}

function addLog(msg, isError) {
 const logBox = document.getElementById("debugLog");
 const time = new Date().toLocaleTimeString();
 const div = document.createElement("div");

 if (isError) {
  div.className = "log-err";
 }

 div.textContent = "[" + time + "] " + msg;
 logBox.appendChild(div);
 logBox.scrollTop = logBox.scrollHeight;
}

function escapeHtml(text) {
 return String(text)
  .replaceAll("&", "&amp;")
  .replaceAll("<", "&lt;")
  .replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;")
  .replaceAll("'", "&#039;");
}

document.addEventListener("DOMContentLoaded", function() {
 document.getElementById("debugLog").innerHTML = "";
 addLog("✓ 網頁已正常載入");
 updateProgress(0, "初始化完成");

 setTimeout(function() {
  executeGrandMasterSearch();
 }, 300);
});

/*
  單檔版 Google AI 連線函數
  只負責連線，不改你的股票判斷邏輯
*/
async function callGoogleAI(prompt) {
 try {
  if (!GOOGLE_API_KEY || GOOGLE_API_KEY === "請貼上你的Google_AI_API_KEY") {
   throw new Error("尚未填入 Google AI API Key");
  }

  addLog("▶ 正在連線 Google AI...");

  const url =
   "https://generativelanguage.googleapis.com/v1beta/models/" +
   GOOGLE_MODEL +
   ":generateContent?key=" +
   GOOGLE_API_KEY;

  const response = await fetch(url, {
   method: "POST",
   headers: {
    "Content-Type": "application/json"
   },
   body: JSON.stringify({
    contents: [
     {
      parts: [
       {
        text: prompt
       }
      ]
     }
    ]
   })
  });

  const data = await response.json();

  if (!response.ok) {
   let msg = "Google AI 回傳錯誤";
   if (data && data.error && data.error.message) {
    msg = data.error.message;
   }
   throw new Error(msg);
  }

  let text = "";

  if (
   data &&
   data.candidates &&
   data.candidates[0] &&
   data.candidates[0].content &&
   data.candidates[0].content.parts &&
   data.candidates[0].content.parts[0] &&
   data.candidates[0].content.parts[0].text
  ) {
   text = data.candidates[0].content.parts[0].text;
  } else {
   text = "Google AI 有回傳，但沒有文字內容。";
  }

  addLog("✓ Google AI 已成功回傳");
  return text;

 } catch (err) {
  addLog("❌ Google AI 連線失敗：" + err.message, true);

  return (
   "❌ Google AI 連線失敗：" + err.message + "\n\n" +
   "請檢查：\n" +
   "1. GOOGLE_API_KEY 是否已貼上\n" +
   "2. API Key 是否有效\n" +
   "3. Google AI Studio 是否有啟用 Gemini API\n" +
   "4. 模型名稱是否正確\n" +
   "5. 如果瀏覽器擋住 CORS，請改用後端版"
  );
 }
}

async function executeGrandMasterSearch() {
 try {
  updateProgress(5, "正在讀取股票代號...");
  addLog("▶ 按鈕已成功觸發");

  const stockId = document.getElementById("stockId").value.trim();

  if (stockId === "") {
   addLog("❌ 股票代號不可空白", true);
   updateProgress(0, "請輸入股票代號");
   return;
  }

  document.getElementById("chartTitle").innerText =
   "技術線圖 台股 " + stockId + " [藍:MA20 | 橘:MA60]";

  updateProgress(20, "正在建立模擬歷史 K 線資料...");
  addLog("✓ 鎖定股票代號：" + stockId);

  const basePrice = getBasePrice(stockId);
  const data = buildStockData(basePrice);

  updateProgress(45, "正在計算 MA20 / MA60...");
  calcMA(data);

  updateProgress(65, "正在進行多空型態判讀...");
  runAnalysis(data, stockId);

  updateProgress(75, "正在連線 Google AI...");

  const originalReport = document.getElementById("reportList").innerText;

  const googlePrompt =
   "你是台股K線分析助理。請只根據以下本系統已產生的判讀報告，做補充說明與風險提醒。" +
   "不要改變原本判斷邏輯，不要保證漲跌，不要叫使用者一定買或一定賣。\n\n" +
   "股票代號：" + stockId + "\n\n" +
   "本系統原始判讀：\n" + originalReport;

  const googleResult = await callGoogleAI(googlePrompt);

  document.getElementById("reportList").innerHTML +=
   '<div class="item master">' +
   '<div class="date">Google AI 連線回傳</div>' +
   '<div class="name">Gemini 補充說明</div>' +
   '<div class="desc">' + escapeHtml(googleResult).replace(/\n/g, "<br>") + '</div>' +
   '</div>';

  updateProgress(85, "正在繪製 K 線圖...");
  drawChart(data);

  updateProgress(100, "分析完成");
  addLog("✓ 分析完成");

 } catch (err) {
  addLog("❌ 錯誤：" + err.message, true);
  updateProgress(0, "系統錯誤");
  console.error(err);
 }
}

function getBasePrice(stockId) {
 if (stockId === "2330") return 920;
 if (stockId === "2317") return 185;
 if (stockId === "3406") return 365;
 if (stockId === "2409") return 18;

 let hash = 0;

 for (let i = 0; i < stockId.length; i++) {
  hash += stockId.charCodeAt(i);
 }

 return hash % 150 + 20;
}

function buildStockData(basePrice) {
 const data = [];
 const today = new Date();

 for (let i = 100; i >= 0; i--) {
  const d = new Date(today.getTime() - i * 24 * 60 * 60 * 1000);

  const dateStr =
   d.getFullYear() + "-" +
   String(d.getMonth() + 1).padStart(2, "0") + "-" +
   String(d.getDate()).padStart(2, "0");

  let wave = Math.sin(i * 0.22) * basePrice * 0.1;
  let trend = (100 - i) * basePrice * 0.0015;
  let close = basePrice + wave + trend;
  let open = close + (Math.random() - 0.5) * basePrice * 0.03;
  let high = Math.max(open, close) + Math.random() * basePrice * 0.02;
  let low = Math.min(open, close) - Math.random() * basePrice * 0.02;

  data.push({
   time: dateStr,
   open: round2(open),
   high: round2(high),
   low: round2(low),
   close: round2(close)
  });
 }

 return data;
}

function calcMA(data) {
 for (let i = 0; i < data.length; i++) {
  let sum20 = 0;
  let count20 = 0;

  for (let j = Math.max(0, i - 19); j <= i; j++) {
   sum20 += data[j].close;
   count20++;
  }

  data[i].ma20 = sum20 / count20;

  let sum60 = 0;
  let count60 = 0;

  for (let k = Math.max(0, i - 59); k <= i; k++) {
   sum60 += data[k].close;
   count60++;
  }

  data[i].ma60 = sum60 / count60;
 }

 addLog("✓ 均線計算完成");
}

function runAnalysis(data, stockId) {
 const reportList = document.getElementById("reportList");
 reportList.innerHTML = "";

 if (stockId === "8913") {
  reportList.innerHTML =
   '<div class="item sell">' +
   '<div class="date">方天龍原著 • 單元 76 一瀉千里</div>' +
   '<div class="name">🚨 天天漲，總會有一天，天天跌！連續跳空漲停之後突然打開</div>' +
   '<div class="desc"><b>大師原創心法：</b>「全銓(8913)是2018年股價的一個驚奇！股價由最低點的 17.68 元一路飆上 90.4 元，這就是驚訝的『一瀉千里』圖譜，說明了股價『怎麼上去，就怎麼下來』。天天漲停板上去，早晚有那麼一天，也會天天跌下來。型態一完成，行情必然直線墜落！那要你當捨則捨，請火速停損、逃命離場！」</div>' +
   '</div>';
  addLog("✓ 成功判定單元 76 【一瀉千里】書本案例");
  return;
 }

 if (stockId === "2409") {
  reportList.innerHTML =
   '<div class="item sell">' +
   '<div class="date">方天龍原著 • 單元 95 兩陰夾一陽哭爹叫娘</div>' +
   '<div class="name">🚨 空頭三明治中繼加速：跌得呼爹叫娘！K線的長短很重要</div>' +
   '<div class="desc"><b>大師原創心法：</b>「這是『友達』(2409)的『空頭三明治』K線組合。圖中的①和②合併形成『多頭孕母子線』，②和③組合合併形成『空頭包絡線』。在跌勢中，出現這檔K線組合，別有一番下跌的空間。中間小紅K身軀精密內困，其後行情果然盤旋向下一跌了！這屬於最高規格的順勢放空點與逃頂訊號！」</div>' +
   '</div>';
  addLog("✓ 成功判定單元 95 【空頭三明治】書本案例");
  return;
 }

 if (stockId === "3406") {
  reportList.innerHTML =
   '<div class="item sell">' +
   '<div class="date">方天龍原著 • 單元 91 空頭遭遇遇見阿飄</div>' +
   '<div class="name">🚨 空頭遭遇，是不對等的合作！隔日沖大戶出貨，股價容易回到原點</div>' +
   '<div class="desc"><b>大師原創心法：</b>「這是『玉晶光』(3406)的『空頭遭遇線』。圖中的收盤價精密對齊平盤。這讓人想起『企業合併』的寓言：藉要求和諧合作拉高，實則大戶故意開高拉盤，火速出清逃頂。表面看來平盤有撐，實則多頭上攻的信心已被主力一口氣吸乾！後續股價極易一瀉千里回到原點！」</div>' +
   '</div>';
  addLog("✓ 成功判定單元 91 【空頭遭遇線】書本案例");
  return;
 }

 const signals = [];

 for (let i = data.length - 1; i >= 2; i--) {
  const curr = data[i];
  const prev = data[i - 1];
  const prev2 = data[i - 2];

  const change = ((curr.close - prev.close) / prev.close) * 100;
  const body = Math.abs(curr.close - curr.open);
  const range = curr.high - curr.low;
  const isRed = curr.close > curr.open;
  const isGreen = curr.close < curr.open;

  if (prev.close < prev.ma20 && curr.close > curr.ma20) {
   signals.push({
    type: "buy",
    date: curr.time,
    name: "突破 MA20 生命線",
    desc: "收盤價站上 MA20，短線轉強。漲跌幅：" + change.toFixed(2) + "%"
   });
  }

  if (prev.close > prev.ma20 && curr.close < curr.ma20) {
   signals.push({
    type: "sell",
    date: curr.time,
    name: "跌破 MA20 生命線",
    desc: "收盤價跌破 MA20，短線轉弱。漲跌幅：" + change.toFixed(2) + "%"
   });
  }

  if (curr.close > curr.ma20 && curr.ma20 > curr.ma60) {
   signals.push({
    type: "buy",
    date: curr.time,
    name: "多頭排列",
    desc: "股價 > MA20 > MA60，趨勢偏多。"
   });
  }

  if (curr.close < curr.ma20 && curr.ma20 < curr.ma60) {
   signals.push({
    type: "sell",
    date: curr.time,
    name: "空頭排列",
    desc: "股價 < MA20 < MA60，趨勢偏空。"
   });
  }

  if (isRed && range > 0 && body / range > 0.65 && change > 2) {
   signals.push({
    type: "master",
    date: curr.time,
    name: "長紅攻擊K",
    desc: "紅K實體較大，代表買盤主動推升。"
   });
  }

  if (isGreen && range > 0 && body / range > 0.65 && change < -2) {
   signals.push({
    type: "master",
    date: curr.time,
    name: "長黑破壞K",
    desc: "黑K實體較大，代表賣壓明顯。"
   });
  }

  if (
   prev2.close < prev2.open &&
   prev.close > prev.open &&
   curr.close < curr.open
  ) {
   signals.push({
    type: "sell",
    date: curr.time,
    name: "空頭三明治",
    desc: "黑紅黑結構，短線有轉弱風險。"
   });
  }

  if (signals.length >= 25) {
   break;
  }
 }

 if (signals.length === 0) {
  reportList.innerHTML =
   '<div class="item"><div class="name">目前無明顯訊號</div><div class="desc">尚未偵測到明確多空型態。</div></div>';
  return;
 }

 for (let i = 0; i < signals.length; i++) {
  const s = signals[i];
  const div = document.createElement("div");
  div.className = "item " + s.type;

  div.innerHTML =
   '<div class="date">' + s.date + '</div>' +
   '<div class="name">' + s.name + '</div>' +
   '<div class="desc">' + s.desc + '</div>';

  reportList.appendChild(div);
 }

 addLog("✓ 偵測到 " + signals.length + " 筆訊號");
}

function drawChart(data) {
 const canvas = document.getElementById("stockCanvas");
 const ctx = canvas.getContext("2d");

 const w = canvas.width;
 const h = canvas.height;
 const padding = 50;

 ctx.clearRect(0, 0, w, h);

 const visible = data.slice(-80);
 const prices = [];

 for (let i = 0; i < visible.length; i++) {
  prices.push(visible[i].high);
  prices.push(visible[i].low);
  prices.push(visible[i].ma20);
  prices.push(visible[i].ma60);
 }

 const maxPrice = Math.max.apply(null, prices);
 const minPrice = Math.min.apply(null, prices);
 const range = maxPrice - minPrice || 1;

 function getX(i) {
  return padding + i * ((w - padding * 2) / visible.length);
 }

 function getY(price) {
  return h - padding - ((price - minPrice) / range) * (h - padding * 2);
 }

 ctx.strokeStyle = "#2a2e39";
 ctx.lineWidth = 1;

 for (let i = 0; i <= 5; i++) {
  const y = padding + i * ((h - padding * 2) / 5);

  ctx.beginPath();
  ctx.moveTo(padding, y);
  ctx.lineTo(w - padding, y);
  ctx.stroke();

  const price = maxPrice - i * range / 5;
  ctx.fillStyle = "#787b86";
  ctx.font = "12px Arial";
  ctx.fillText(price.toFixed(2), 8, y + 4);
 }

 const candleW = 6;

 for (let i = 0; i < visible.length; i++) {
  const d = visible[i];
  const x = getX(i);

  const openY = getY(d.open);
  const closeY = getY(d.close);
  const highY = getY(d.high);
  const lowY = getY(d.low);

  const up = d.close >= d.open;
  ctx.strokeStyle = up ? "#ef5350" : "#26a69a";
  ctx.fillStyle = up ? "#ef5350" : "#26a69a";

  ctx.beginPath();
  ctx.moveTo(x, highY);
  ctx.lineTo(x, lowY);
  ctx.stroke();

  const top = Math.min(openY, closeY);
  const height = Math.max(Math.abs(closeY - openY), 1);

  ctx.fillRect(x - candleW / 2, top, candleW, height);
 }

 drawLine(ctx, visible, "ma20", getX, getY, "#2962ff");
 drawLine(ctx, visible, "ma60", getX, getY, "#ff9800");
}

function drawLine(ctx, data, key, getX, getY, color) {
 ctx.beginPath();
 ctx.strokeStyle = color;
 ctx.lineWidth = 2;

 for (let i = 0; i < data.length; i++) {
  const x = getX(i);
  const y = getY(data[i][key]);

  if (i === 0) {
   ctx.moveTo(x, y);
  } else {
   ctx.lineTo(x, y);
  }
 }

 ctx.stroke();
}

function round2(num) {
 return Math.round(num * 100) / 100;
}
