<script>
function updateProgress(percent, text) {
    document.getElementById("myBar").style.width = percent + "%";
    document.getElementById("myText").innerText = percent + "%";
    document.getElementById("stepStatus").innerText = text;
}

function addLog(msg, isError = false) {
    const logBox = document.getElementById("debugLog");
    if (!logBox) return;

    const time = new Date().toLocaleTimeString();
    const div = document.createElement("div");

    if (isError) div.className = "log-err";
    div.textContent = `[${time}] ${msg}`;

    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}

document.addEventListener("DOMContentLoaded", function() {
    addLog("✓ 網頁元件加載完成");
    updateProgress(0, "初始化完成，等待查詢...");
    setTimeout(executeGrandMasterSearch, 300);
});

function executeGrandMasterSearch() {
    try {
        updateProgress(5, "正在讀取股票代號...");
        addLog("▶ 已觸發藍色按鈕查詢");

        const stockInput = document.getElementById("stockId");
        const stockId = stockInput.value.trim();

        if (!stockId) {
            addLog("❌ 股票代號不可為空", true);
            updateProgress(0, "請輸入股票代號");
            return;
        }

        document.getElementById("chartTitle").innerText =
            `技術線圖 台股 ${stockId} [藍:MA20 | 橘:MA60]`;

        updateProgress(20, `已鎖定個股 ${stockId}，正在建立資料...`);
        addLog(`✓ 鎖定股票代號：${stockId}`);

        let basePrice = getBasePrice(stockId);
        let rawData = buildFakeStockData(basePrice);

        updateProgress(40, "歷史資料建立完成，正在計算 MA20 / MA60...");
        calcMA(rawData);

        addLog(`✓ 已產生 ${rawData.length} 筆K線資料`);
        addLog("✓ MA20 與 MA60 計算完成");

        updateProgress(60, "正在執行 K 線型態判讀...");
        runGrandMasterLogic(rawData, stockId);

        updateProgress(100, "分析完成");
        addLog("✅ 全部分析完成");

    } catch (err) {
        addLog(`❌ 系統錯誤：${err.message}`, true);
        updateProgress(0, "系統錯誤，請看下方日誌");
        console.error(err);
    }
}

function getBasePrice(stockId) {
    if (stockId === "2330") return 920;
    if (stockId === "3406") return 365;
    if (stockId === "2317") return 185;
    if (stockId === "2409") return 18;

    let hash = 0;
    for (let i = 0; i < stockId.length; i++) {
        hash += stockId.charCodeAt(i);
    }

    return (hash % 150) + 15;
}

function buildFakeStockData(basePrice) {
    let rawData = [];
    let baseDate = new Date();

    for (let i = 100; i >= 0; i--) {
        let d = new Date(baseDate.getTime() - i * 24 * 60 * 60 * 1000);
        let dateStr =
            `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

        let wave = Math.sin(i * 0.2) * (basePrice * 0.12);
        let trend = (100 - i) * (basePrice * 0.002);

        let close = basePrice + wave + trend;
        let open = close + (Math.random() - 0.5) * (basePrice * 0.025);
        let high = Math.max(open, close) + Math.random() * (basePrice * 0.015);
        let low = Math.min(open, close) - Math.random() * (basePrice * 0.015);

        // 空頭三明治示範
        if (i === 12) {
            open = basePrice * 1.16;
            close = basePrice * 1.07;
            high = open * 1.01;
            low = close * 0.99;
        }

        if (i === 11) {
            open = basePrice * 1.08;
            close = basePrice * 1.10;
            high = close * 1.01;
            low = open * 0.99;
        }

        if (i === 10) {
            open = basePrice * 1.11;
            close = basePrice * 1.03;
            high = open * 1.01;
            low = close * 0.99;
        }

        // 起漲階梯示範
        if (i === 55) {
            open = basePrice * 0.85;
            close = basePrice * 0.86;
            high = close * 1.002;
            low = open * 0.998;
        }

        if (i === 54) {
            open = basePrice * 0.861;
            close = basePrice * 0.871;
            high = close * 1.002;
            low = open * 0.998;
        }

        if (i === 53) {
            open = basePrice * 0.872;
            close = basePrice * 0.882;
            high = close * 1.002;
            low = open * 0.998;
        }

        if (i === 52) {
            open = basePrice * 0.885;
            close = basePrice * 0.950;
            high = close * 1.01;
            low = open * 0.99;
        }

        rawData.push({
            time: dateStr,
            open: round2(open),
            high: round2(high),
            low: round2(low),
            close: round2(close)
        });
    }

    return rawData;
}

function calcMA(data) {
    for (let i = 0; i < data.length; i++) {
        if (i >= 19) {
            let sum20 = 0;
            for (let j = i - 19; j <= i; j++) {
                sum20 += data[j].close;
            }
            data[i].ma20 = sum20 / 20;
        } else {
            data[i].ma20 = data[i].close;
        }

        if (i >= 59) {
            let sum60 = 0;
            for (let j = i - 59; j <= i; j++) {
                sum60 += data[j].close;
            }
            data[i].ma60 = sum60 / 60;
        } else {
            data[i].ma60 = data[i].close * 0.97;
        }
    }
}

function runGrandMasterLogic(data, stockId) {
    const reportList = document.getElementById("reportList");
    reportList.innerHTML = "";

    let signals = [];

    addLog("▶ 開始執行多空判讀");

    for (let i = data.length - 1; i >= 20; i--) {
        const curr = data[i];
        const prev = data[i - 1];
        const prev2 = data[i - 2];

        if (!curr || !prev || !prev2) continue;

        const change = ((curr.close - prev.close) / prev.close) * 100;
        const body = Math.abs(curr.close - curr.open);
        const range = curr.high - curr.low;
        const isRed = curr.close > curr.open;
        const isGreen = curr.close < curr.open;

        // 多頭：站上 MA20
        if (prev.close < prev.ma20 && curr.close > curr.ma20) {
            signals.push({
                type: "buy",
                date: curr.time,
                name: "突破 MA20 生命線",
                desc: `收盤 ${curr.close} 站上 MA20，短線轉強。漲跌幅 ${change.toFixed(2)}%。`
            });
        }

        // 空頭：跌破 MA20
        if (prev.close > prev.ma20 && curr.close < curr.ma20) {
            signals.push({
                type: "sell",
                date: curr.time,
                name: "跌破 MA20 生命線",
                desc: `收盤 ${curr.close} 跌破 MA20，短線轉弱。漲跌幅 ${change.toFixed(2)}%。`
            });
        }

        // 多頭排列
        if (curr.close > curr.ma20 && curr.ma20 > curr.ma60) {
            signals.push({
                type: "buy",
                date: curr.time,
                name: "多頭排列",
                desc: `股價 > MA20 > MA60，趨勢偏多。`
            });
        }

        // 空頭排列
        if (curr.close < curr.ma20 && curr.ma20 < curr.ma60) {
            signals.push({
                type: "sell",
                date: curr.time,
                name: "空頭排列",
                desc: `股價 < MA20 < MA60，趨勢偏空。`
            });
        }

        // 長紅K
        if (isRed && range > 0 && body / range > 0.65 && change > 2) {
            signals.push({
                type: "buy",
                date: curr.time,
                name: "長紅攻擊K",
                desc: `實體K棒強，買盤主動推升，當日漲幅 ${change.toFixed(2)}%。`
            });
        }

        // 長黑K
        if (isGreen && range > 0 && body / range > 0.65 && change < -2) {
            signals.push({
                type: "sell",
                date: curr.time,
                name: "長黑破壞K",
                desc: `實體黑K偏弱，賣壓明顯，當日跌幅 ${change.toFixed(2)}%。`
            });
        }

        // 空頭三明治
        if (
            prev2.close < prev2.open &&
            prev.close > prev.open &&
            curr.close < curr.open &&
            curr.close < prev.close
        ) {
            signals.push({
                type: "master",
                date: curr.time,
                name: "空頭三明治型態",
                desc: `黑紅黑結構出現，代表反彈後再度轉弱，短線需注意賣壓。`
            });
        }

        // 起漲階梯
        if (
            curr.close > prev.close &&
            prev.close > prev2.close &&
            curr.close > curr.open &&
            prev.close > prev.open
        ) {
            signals.push({
                type: "master",
                date: curr.time,
                name: "起漲階梯型態",
                desc: `連續墊高，短線買盤有累積跡象。`
            });
        }

        if (signals.length >= 35) break;
    }

    drawChart(data);

    if (signals.length === 0) {
        reportList.innerHTML = `
            <div class="item">
                <div class="name">目前無明顯訊號</div>
                <div class="desc">此股目前沒有偵測到明顯多空型態，建議等待量價突破後再觀察。</div>
            </div>
        `;
        return;
    }

    signals.forEach(sig => {
        const div = document.createElement("div");
        div.className = `item ${sig.type}`;
        div.innerHTML = `
            <div class="date">${sig.date}</div>
            <div class="name">${sig.name}</div>
            <div class="desc">${sig.desc}</div>
        `;
        reportList.appendChild(div);
    });

    addLog(`✓ 共偵測到 ${signals.length} 筆型態訊號`);
}

function drawChart(data) {
    const canvas = document.getElementById("stockCanvas");
    const ctx = canvas.getContext("2d");

    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);

    const padding = 50;
    const chartW = w - padding * 2;
    const chartH = h - padding * 2;

    const visibleData = data.slice(-80);

    let maxPrice = Math.max(...visibleData.map(d => d.high), ...visibleData.map(d => d.ma20), ...visibleData.map(d => d.ma60));
    let minPrice = Math.min(...visibleData.map(d => d.low), ...visibleData.map(d => d.ma20), ...visibleData.map(d => d.ma60));

    const priceRange = maxPrice - minPrice || 1;

    function x(i) {
        return padding + i * (chartW / visibleData.length);
    }

    function y(price) {
        return padding + chartH - ((price - minPrice) / priceRange) * chartH;
    }

    // 背景格線
    ctx.strokeStyle = "#2a2e39";
    ctx.lineWidth = 1;

    for (let i = 0; i <= 5; i++) {
        let gy = padding + (chartH / 5) * i;
        ctx.beginPath();
        ctx.moveTo(padding, gy);
        ctx.lineTo(w - padding, gy);
        ctx.stroke();

        let price = maxPrice - (priceRange / 5) * i;
        ctx.fillStyle = "#787b86";
        ctx.font = "12px Arial";
        ctx.fillText(price.toFixed(2), 8, gy + 4);
    }

    const candleW = Math.max(4, chartW / visibleData.length * 0.55);

    visibleData.forEach((d, i) => {
        const cx = x(i);
        const openY = y(d.open);
        const closeY = y(d.close);
        const highY = y(d.high);
        const lowY = y(d.low);

        const isUp = d.close >= d.open;
        ctx.strokeStyle = isUp ? "#ef5350" : "#26a69a";
        ctx.fillStyle = isUp ? "#ef5350" : "#26a69a";

        ctx.beginPath();
        ctx.moveTo(cx, highY);
        ctx.lineTo(cx, lowY);
        ctx.stroke();

        const bodyTop = Math.min(openY, closeY);
        const bodyH = Math.max(Math.abs(closeY - openY), 1);

        ctx.fillRect(cx - candleW / 2, bodyTop, candleW, bodyH);
    });

    drawLine(ctx, visibleData, "ma20", x, y, "#2962ff");
    drawLine(ctx, visibleData, "ma60", x, y, "#ff9800");
}

function drawLine(ctx, data, key, xFunc, yFunc, color) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

    data.forEach((d, i) => {
        const x = xFunc(i);
        const y = yFunc(d[key]);

        if (i === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    });

    ctx.stroke();
}

function round2(num) {
    return Math.round(num * 100) / 100;
}
</script>
