async function executeGrandMasterSearch() {
 try {
  updateProgress(5, "正在讀取股票代號...");
  addLog("▶ 按鈕已成功觸發");

  const stockId = document.getElementById("stockId").value.trim();

  if (stockId === "") {
   addLog("❌ 股票代號不可空白", true);
   updateProgress(0, "請輸入股票代號");
   return;
  }

  document.getElementById("chartTitle").innerText =
   "技術線圖 台股 " + stockId + " [藍:MA20 | 橘:MA60]";
  document.getElementById("reportList").innerHTML = "";
  document.getElementById("summaryBox").innerHTML = "";

  updateProgress(20, "正在透過 Worker 抓取真實 K 線資料...");
  addLog("✓ 鎖定股票代號：" + stockId);

  const data = await fetchRealStockData(stockId);

  updateProgress(42, "正在計算 MA / 量能 / 位置 / 趨勢...");
  calcIndicators(data);

  updateProgress(68, "正在進行方天龍 01～95 V2 規則判讀...");
  runAnalysisV2(data, stockId);

  updateProgress(88, "正在繪製真實 K 線圖...");
  drawChart(data);

  updateProgress(100, "分析完成");
  addLog("✓ V2 分析完成");

 } catch (err) {
  addLog("❌ 錯誤：" + err.message, true);
  updateProgress(0, "系統錯誤");
  console.error(err);
 }
}

async function fetchRealStockData(stockId) {
 addLog("▶ 呼叫 Worker 後端抓取真實 K 線：" + stockId);

 const response = await fetch(WORKER_BASE_URL + "/api/stock?stockId=" + encodeURIComponent(stockId));
 const json = await response.json();

 if (!response.ok || !json.ok) {
  throw new Error(json.error || "後端抓取失敗");
 }

 if (!json.data || json.data.length < 60) {
  throw new Error("K 線資料不足，至少需要 60 筆以上");
 }

 addLog("✓ 真實 K 線資料成功，來源：" + json.source + "，共 " + json.data.length + " 筆");
 return json.data;
}

function calcIndicators(data) {
 for (let i = 0; i < data.length; i++) {
  data[i].ma5 = avgClose(data, i, 5);
  data[i].ma10 = avgClose(data, i, 10);
  data[i].ma20 = avgClose(data, i, 20);
  data[i].ma60 = avgClose(data, i, 60);
  data[i].vol5 = avgVol(data, i, 5);
  data[i].vol20 = avgVol(data, i, 20);

  if (i > 0) {
   data[i].chgPct = ((data[i].close - data[i - 1].close) / data[i - 1].close) * 100;
  } else {
   data[i].chgPct = 0;
  }
 }
 addLog("✓ 指標計算完成：MA5/10/20/60、VOL5/20、漲跌幅");
}

function avgClose(data, i, n) {
 let sum = 0;
 let count = 0;
 for (let j = Math.max(0, i - n + 1); j <= i; j++) {
  sum += Number(data[j].close);
  count++;
 }
 return sum / count;
}

function avgVol(data, i, n) {
 let sum = 0;
 let count = 0;
 for (let j = Math.max(0, i - n + 1); j <= i; j++) {
  sum += Number(data[j].volume || 0);
  count++;
 }
 return count > 0 ? sum / count : 0;
}

 89:r(89,"宵三紅","bear",-18,"evening_three_red","多方末端勉強上攻，後續轉黑偏空。"),
 90:r(90,"雙鴉跳空","bear",-20,"two_crows","跳空後連續黑 K 壓回，上攻失敗。"),
 91:r(91,"空頭遭遇","bear",-18,"bear_meeting","高檔平盤附近遭遇賣壓。"),
 92:r(92,"劍空包容線","bear",-20,"bear_variant","高檔包容轉弱，空方接手。"),
 93:r(93,"走跌停勢","bear",-24,"limit_down","連續急跌或接近跌停，防慣性下殺。"),
 94:r(94,"下跌三法","bear",-22,"falling_three","下跌中繼整理後再跌，空方延續。"),
 95:r(95,"空頭三明治","bear",-22,"bear_sandwich","黑紅黑若在跌勢或反彈末端，反彈失敗。")
};

function runAnalysisV2(data, stockId) {
 const reportList = document.getElementById("reportList");
 reportList.innerHTML = "";

 const signals = detectFTLV2(data);
 const final = buildFinalScore(signals, data);

 renderSummaryV2(final, signals.length);

 if (signals.length === 0) {
  reportList.innerHTML =
   '<div class="item"><div class="name">目前無明顯訊號</div><div class="desc">尚未偵測到明確多空型態，建議觀察 MA20 與前高前低。</div></div>';
  return;
 }

 for (let i = 0; i < signals.length; i++) {
  const s = signals[i];
  const div = document.createElement("div");
  div.className = "item " + s.type;

  div.innerHTML =
   '<div class="date">' + s.date + '</div>' +
   '<div class="name">' + s.name + '</div>' +
   '<div class="desc">' +
   '<span class="tag">' + s.position + '</span>' +
   '<span class="tag">' + s.volumeText + '</span>' +
   s.desc +
   '<br>確認：' + s.confirm +
   '<br>失效：' + s.fail +
   '<br>V2 分數：' + s.finalScore +
   '</div>';

  reportList.appendChild(div);
 }

 addLog("✓ 方天龍 V2 規則庫命中 " + signals.length + " 筆訊號");
}

function buildFinalScore(signals, data) {
 let bull = 0;
 let bear = 0;

 for (let i = 0; i < signals.length; i++) {
  if (signals[i].finalScore > 0) bull += signals[i].finalScore;
  if (signals[i].finalScore < 0) bear += Math.abs(signals[i].finalScore);
 }

 const last = data[data.length - 1];
 const trendBonus = getTrendBonus(last);

 if (trendBonus > 0) bull += trendBonus;
 if (trendBonus < 0) bear += Math.abs(trendBonus);

 return {
  bullScore: Math.round(bull),
  bearScore: Math.round(bear),
  trendBonus: trendBonus
 };
}

function renderSummaryV2(final, count) {
 let bias = "盤整觀察";
 let color = "#ff9100";
 const bull = final.bullScore;
 const bear = final.bearScore;

 if (bull > bear * 1.3) {
  bias = "多方優勢";
  color = "#ef5350";
 } else if (bear > bull * 1.3) {
  bias = "空方優勢";
  color = "#26a69a";
 }

 document.getElementById("summaryBox").innerHTML =
  '<div class="summary-card" style="border-left-color:' + color + '">' +
  '<div class="label">V2 綜合方向</div>' +
  '<div class="value">' + bias + '</div>' +
  '<div class="note">趨勢加權：' + final.trendBonus + '</div>' +
  '</div>' +
  '<div class="summary-card">' +
  '<div class="label">多方分數</div>' +
  '<div class="value">' + bull + '</div>' +
  '<div class="note">含型態、量能、位置</div>' +
  '</div>' +
  '<div class="summary-card">' +
  '<div class="label">空方分數 / 命中</div>' +
  '<div class="value">' + bear + " / " + count + '</div>' +
  '<div class="note">分數高代表訊號密集</div>' +
  '</div>';
}

function detectFTLV2(data) {
 const signals = [];
 const start = Math.max(2, data.length - 80);

 for (let i = start; i < data.length; i++) {
  const c = data[i];
  const p = data[i - 1];
  const p2 = data[i - 2];
  const ci = candleInfo(c, p);
  const pi = candleInfo(p, p2);
  const pos = trendPosition(data, i);
  const vol = volumeState(data, i);

  if (c.low > p.high) addSignal(signals, 4, c, pos, vol, "向上跳空缺口出現，代表買盤主動進攻。", "缺口不被快速回補，且收盤站穩缺口上緣。", "跌回缺口下緣或 3 日內完全回補。");
  if (c.high < p.low) addSignal(signals, 7, c, pos, vol, "向下跳空缺口出現，代表賣壓主動下殺。", "反彈無法回補缺口，且續跌。", "站回缺口上緣。");

  if (i >= 4) {
   const gapsUp = countUpGaps(data, i, 5);
   const gapsDown = countDownGaps(data, i, 5);
   if (gapsUp >= 3) addSignal(signals, 2, c, pos, vol, "近期出現多次向上缺口，行情進入加速段。", "缺口持續不補且量能支持。", "第三缺口後爆量長黑或缺口回補。");
   if (gapsDown >= 3) addSignal(signals, 3, c, pos, vol, "近期出現多次向下缺口，空方慣性明顯。", "反彈無法回補缺口。", "長紅站回缺口區。");
  }

  if (p.close <= p.ma20 && c.close > c.ma20) addSignal(signals, 29, c, pos, vol, "收盤站上 MA20 生命線，短線轉強。", "隔日仍守 MA20，或帶量續漲。", "跌回 MA20 下方。");
  if (p.close >= p.ma20 && c.close < c.ma20) addSignal(signals, 58, c, pos, vol, "收盤跌破 MA20，短線轉弱。", "反抽無法站回 MA20。", "隔日重新站回 MA20。");

  if (c.close > c.ma20 && c.ma20 > c.ma60 && c.ma5 > c.ma10) addSignal(signals, 33, c, pos, vol, "均線呈多頭開口，股價位於生命線上方。", "MA5、MA10、MA20 維持向上。", "跌破 MA20 或 MA5 下彎。");
  if (c.close < c.ma20 && c.ma20 < c.ma60 && c.ma5 < c.ma10) addSignal(signals, 72, c, pos, vol, "均線呈空頭結構，股價位於生命線下方。", "反彈不過 MA20。", "站回 MA20 且 MA5 翻揚。");

  if (ci.isBull && ci.bodyRatio > 0.65 && c.chgPct > 2) addSignal(signals, 11, c, pos, vol, "長紅 K 出現，買盤力道明顯。", "後續量增不破長紅低點。", "跌破長紅低點或隔日長黑吞噬。");
  if (ci.isBear && ci.bodyRatio > 0.65 && c.chgPct < -2) addSignal(signals, 47, c, pos, vol, "長黑 K 出現，賣壓明顯。", "反彈不過長黑中值。", "重新站回長黑高點。");

  if (ci.bodyRatio < 0.12) {
   if (pos === "高檔") addSignal(signals, 20, c, pos, vol, "高檔十字，代表多空猶豫與追價停頓。", "隔日跌破十字低點。", "隔日長紅站上十字高點。");
   else if (pos === "低檔") addSignal(signals, 19, c, pos, vol, "低檔十字，代表殺盤可能鈍化。", "隔日紅 K 站上十字高點。", "跌破十字低點。");
   else addSignal(signals, 17, c, pos, vol, "十字線代表多空拉鋸，等待方向確認。", "突破十字高低點。", "區間內持續震盪。");
  }

  if (pos === "低檔" && ci.lowerShadowRatio > 0.55 && ci.bodyRatio < 0.35) addSignal(signals, 25, c, pos, vol, "低檔錘子線，下方承接力浮現。", "隔日站上錘子高點。", "跌破錘子低點。");
  if (pos === "高檔" && ci.upperShadowRatio > 0.55 && ci.bodyRatio < 0.35) addSignal(signals, 86, c, pos, vol, "高檔流星線，上攻遇壓。", "跌破流星線低點。", "站回流星線高點。");

  if (p.close < p.open && c.close > c.open && c.close > p.open && c.open < p.close) addSignal(signals, 50, c, pos, vol, "紅 K 包覆前黑 K，低檔較偏多。", "站上包絡高點。", "跌破包絡低點。");
  if (p.close > p.open && c.close < c.open && c.open > p.close && c.close < p.open) addSignal(signals, 78, c, pos, vol, "黑 K 吞噬前紅 K，賣壓轉強。", "跌破包絡低點。", "站回包絡高點。");

  if (p2.close > p2.open && p.close > p.open && c.close > c.open && p.close > p2.close && c.close > p.close) addSignal(signals, 45, c, pos, vol, "連續三根紅 K 推進，紅三兵結構。", "不跌破第三根紅 K 低點。", "長黑吞噬三紅。");
  if (p2.close < p2.open && p.close < p.open && c.close < c.open && p.close < p2.close && c.close < p.close) addSignal(signals, 84, c, pos, vol, "連續三根黑 K 下壓，三烏鴉結構。", "反彈不過第三根黑 K 高點。", "長紅站回三烏鴉高點。");

  if (p2.close < p2.open && p.close > p.open && c.close < c.open && c.close < p.close) addSignal(signals, 95, c, pos, vol, "黑紅黑結構，反彈失敗風險提高。", "跌破第三根黑 K 低點。", "站回第二根紅 K 高點。");

  if (c.close > p.close && p.close > p2.close && c.low >= p.low && p.low >= p2.low) addSignal(signals, 67, c, pos, vol, "收盤與低點逐步墊高，形成起漲階梯。", "續創高且回檔不破前低。", "跌破階梯前低。");

  if (isTripleTop(data, i)) addSignal(signals, 75, c, pos, vol, "近期多次挑戰高點未過，壓力明顯。", "跌破頸線或 MA20。", "帶量突破前高。");

  const box = boxBreak(data, i);
  if (box === "up") addSignal(signals, 40, c, pos, vol, "突破近期箱型上緣，偏多觀察。", "回測箱頂不破。", "跌回箱型內。");
  if (box === "down") addSignal(signals, 40, c, pos, vol, "跌破近期箱型下緣，偏空觀察。", "反抽箱底不過。", "重新站回箱型。");

  if (isMorningStar(data, i)) addSignal(signals, 54, c, pos, vol, "低檔晨星類反轉結構，止跌反彈機率提高。", "第三根紅 K 續強。", "跌破星線低點。");
  if (isEveningStar(data, i)) addSignal(signals, 82, c, pos, vol, "高檔夜星類轉弱結構，需防反轉。", "第三根黑 K 續弱。", "站回星線高點。");
  if (isDarkCloud(data, i)) addSignal(signals, 81, c, pos, vol, "高檔紅 K 後黑 K 壓回，烏雲蓋頂。", "跌破黑 K 低點。", "站回前紅 K 高點。");
 }

 return mergeSignals(signals);
}

function addSignal(signals, ruleId, candle, position, volumeText, desc, confirm, fail) {
 const rule = RULES[ruleId];
 if (!rule) return;

 let finalScore = rule.score;
 finalScore += positionWeight(rule.bias, position);
 finalScore += volumeWeight(rule.bias, volumeText);

 signals.push({
  id: rule.id,
  date: candle.time,
  name: "單元 " + String(rule.id).padStart(2, "0") + "｜" + rule.name,
  type: rule.bias === "bull" ? "buy" : rule.bias === "bear" ? "sell" : "master",
  desc: desc + "｜" + rule.msg,
  score: rule.score,
  finalScore: Math.round(finalScore),
  position: position,
  volumeText: volumeText,
  confirm: confirm,
  fail: fail
 });
}

function candleInfo(c, p) {
 const range = Math.max(c.high - c.low, 0.0001);
 const body = Math.abs(c.close - c.open);
 const upper = c.high - Math.max(c.open, c.close);
 const lower = Math.min(c.open, c.close) - c.low;

 return {
  isBull: c.close > c.open,
  isBear: c.close < c.open,
  bodyRatio: body / range,
  upperShadowRatio: upper / range,
  lowerShadowRatio: lower / range,
  changePct: p ? ((c.close - p.close) / p.close) * 100 : 0
 };
}

function trendPosition(data, i) {
 const start = Math.max(0, i - 60);
 const section = data.slice(start, i + 1);
 const highs = section.map(d => d.high);
 const lows = section.map(d => d.low);
 const maxHigh = Math.max.apply(null, highs);
 const minLow = Math.min.apply(null, lows);
 const pos = (data[i].close - minLow) / Math.max(maxHigh - minLow, 0.0001);

 if (pos > 0.75) return "高檔";
 if (pos < 0.25) return "低檔";
 return "中段";
}

function volumeState(data, i) {
 const c = data[i];
 if (!c.volume || !c.vol20) return "量能普通";
 if (c.volume > c.vol20 * 1.8) return "爆量";
 if (c.volume > c.vol20 * 1.25) return "放量";
 if (c.volume < c.vol20 * 0.65) return "量縮";
 return "量能普通";
}

function positionWeight(bias, pos) {
 if (bias === "bull" && pos === "低檔") return 5;
 if (bias === "bull" && pos === "高檔") return -4;
 if (bias === "bear" && pos === "高檔") return -5;
 if (bias === "bear" && pos === "低檔") return 4;
 return 0;
}

function volumeWeight(bias, vol) {
 if (bias === "bull" && (vol === "放量" || vol === "爆量")) return 4;
 if (bias === "bull" && vol === "量縮") return -3;
 if (bias === "bear" && (vol === "放量" || vol === "爆量")) return -4;
 if (bias === "bear" && vol === "量縮") return 2;
 return 0;
}

function getTrendBonus(last) {
 if (last.close > last.ma20 && last.ma20 > last.ma60 && last.ma5 > last.ma10) return 15;
 if (last.close < last.ma20 && last.ma20 < last.ma60 && last.ma5 < last.ma10) return -15;
 return 0;
}

function countUpGaps(data, i, n) {
 let count = 0;
 for (let x = Math.max(1, i - n + 1); x <= i; x++) {
  if (data[x].low > data[x - 1].high) count++;
 }
 return count;
}

function countDownGaps(data, i, n) {
 let count = 0;
 for (let x = Math.max(1, i - n + 1); x <= i; x++) {
  if (data[x].high < data[x - 1].low) count++;
 }
 return count;
}

function isTripleTop(data, i) {
 if (i < 40) return false;
 const recent = data.slice(i - 40, i + 1);
 const currHigh = data[i].high;
 let touch = 0;
 for (let j = 0; j < recent.length; j++) {
  if (Math.abs(recent[j].high - currHigh) / currHigh < 0.025) touch++;
 }
 return touch >= 3 && trendPosition(data, i) === "高檔";
}

function boxBreak(data, i) {
 if (i < 30) return "";
 const prev = data.slice(i - 30, i);
 const highs = prev.map(d => d.high);
 const lows = prev.map(d => d.low);
 const hi = Math.max.apply(null, highs);
 const lo = Math.min.apply(null, lows);
 if (data[i].close > hi) return "up";
 if (data[i].close < lo) return "down";
 return "";
}

function isMorningStar(data, i) {
 if (i < 2) return false;
 const a = data[i - 2], b = data[i - 1], c = data[i];
 const ai = candleInfo(a, null), bi = candleInfo(b, null), ci = candleInfo(c, null);
 return ai.isBear && ai.bodyRatio > 0.45 && bi.bodyRatio < 0.35 && ci.isBull && c.close > (a.open + a.close) / 2 && trendPosition(data, i) !== "高檔";
}

function isEveningStar(data, i) {
 if (i < 2) return false;
 const a = data[i - 2], b = data[i - 1], c = data[i];
 const ai = candleInfo(a, null), bi = candleInfo(b, null), ci = candleInfo(c, null);
 return ai.isBull && ai.bodyRatio > 0.45 && bi.bodyRatio < 0.35 && ci.isBear && c.close < (a.open + a.close) / 2 && trendPosition(data, i) !== "低檔";
}

function isDarkCloud(data, i) {
 if (i < 1) return false;
 const p = data[i - 1], c = data[i];
 return p.close > p.open && c.close < c.open && c.open > p.close && c.close < (p.open + p.close) / 2 && c.close > p.open && trendPosition(data, i) === "高檔";
}

function mergeSignals(signals) {
 const map = {};
 const result = [];

 for (let i = signals.length - 1; i >= 0; i--) {
  const s = signals[i];
  const key = s.id + "_" + s.date;
  if (!map[key]) {
   map[key] = true;
   result.push(s);
  }
 }

 result.sort(function(a, b) {
  return Math.abs(b.finalScore) - Math.abs(a.finalScore);
 });

 return result.slice(0, 40);
}

function drawChart(data) {
 const canvas = document.getElementById("stockCanvas");
 const ctx = canvas.getContext("2d");

 const w = canvas.width;
 const h = canvas.height;
 const padding = 50;

 ctx.clearRect(0, 0, w, h);

 const visible = data.slice(-90);
 const prices = [];

 for (let i = 0; i < visible.length; i++) {
  prices.push(visible[i].high);
  prices.push(visible[i].low);
  prices.push(visible[i].ma20);
  prices.push(visible[i].ma60);
 }

 const maxPrice = Math.max.apply(null, prices);
 const minPrice = Math.min.apply(null, prices);
 const range = maxPrice - minPrice || 1;

 function getX(i) {
  return padding + i * ((w - padding * 2) / visible.length);
 }

 function getY(price) {
  return h - padding - ((price - minPrice) / range) * (h - padding * 2);
 }

 ctx.strokeStyle = "#2a2e39";
 ctx.lineWidth = 1;

 for (let i = 0; i <= 5; i++) {
  const y = padding + i * ((h - padding * 2) / 5);
  ctx.beginPath();
  ctx.moveTo(padding, y);
  ctx.lineTo(w - padding, y);
  ctx.stroke();

  const price = maxPrice - i * range / 5;
  ctx.fillStyle = "#787b86";
  ctx.font = "12px Arial";
  ctx.fillText(price.toFixed(2), 8, y + 4);
 }

 const candleW = Math.max(4, ((w - padding * 2) / visible.length) * 0.55);

 for (let i = 0; i < visible.length; i++) {
  const d = visible[i];
  const x = getX(i);

  const openY = getY(d.open);
  const closeY = getY(d.close);
  const highY = getY(d.high);
  const lowY = getY(d.low);

  const up = d.close >= d.open;
  ctx.strokeStyle = up ? "#ef5350" : "#26a69a";
  ctx.fillStyle = up ? "#ef5350" : "#26a69a";

  ctx.beginPath();
  ctx.moveTo(x, highY);
  ctx.lineTo(x, lowY);
  ctx.stroke();

  const top = Math.min(openY, closeY);
  const height = Math.max(Math.abs(closeY - openY), 1);
  ctx.fillRect(x - candleW / 2, top, candleW, height);
 }

 drawLine(ctx, visible, "ma20", getX, getY, "#2962ff");
 drawLine(ctx, visible, "ma60", getX, getY, "#ff9800");
}

function drawLine(ctx, data, key, getX, getY, color) {
 ctx.beginPath();
 ctx.strokeStyle = color;
 ctx.lineWidth = 2;

 for (let i = 0; i < data.length; i++) {
  const x = getX(i);
  const y = getY(data[i][key]);
  if (i === 0) ctx.moveTo(x, y);
  else ctx.lineTo(x, y);
 }

 ctx.stroke();
}
